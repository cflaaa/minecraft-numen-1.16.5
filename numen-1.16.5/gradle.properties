# Numen 1.16.5 移植版
#
# 版本坐标全部按 1.16.5 这一代选；改动任何一项都要同步检查 core/build.gradle
# 与 core/src/main/resources/fabric.mod.json。

# Project
version=0.1.4-1.16.5
group=com.dwinovo.numen
# 引擎层（lua/agent/ai）用了 record、文本块等语言特性，编译目标是 17。
# 这不是随意选的：见 docs/PORTING.md「为什么是 Java 17」。
java_version=17

# Common
minecraft_version=1.16.5
mod_name=Numen
mod_author=dwinovo
license=LGPL-3.0-only
credits=
description=LLM-powered AI companions, backported to 1.16.5. Summon a companion (a server-side fake player) and just talk to it; an agent running on your own machine and your own API key plans and carries out the work.
# 1.16.5 是这条线最后一个版本，所以范围收在一个点上。
minecraft_version_range=[1.16.5,1.16.6)

# Fabric, see https://fabricmc.net/develop/
# 1.16.5 的 API 终版就是 0.42.0+1.16（之后 Fabric API 不再为 1.16 发版）。
fabric_version=0.42.0+1.16
# Loader 0.14.x 是仍支持 Java 8 起点的最后一条线，也是 1.16.5 上最稳的一档。
fabric_loader_version=0.14.25
# 用官方 Mojang 映射（与上游一致），源码里的类名/方法名与上游一一对应，
# 移植时不必在 Yarn 名之间做心算。loom 会自动下载。
# yarn_mappings=1.16.5+build.10   # 仅在改用 yarn 映射时需要

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
