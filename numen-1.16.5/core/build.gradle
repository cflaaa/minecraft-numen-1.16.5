// numen-core：1.16.5 这一侧的模组本体。
//
// 与上游 core/fabric 的分工相同：这一层只做「Minecraft 适配」——
// 把同伴做成一具服务端假玩家、把世界操作包装成工具、把引擎层接到游戏里。
// 与 MC 版本无关的逻辑一律留在 agent / ai / lua 里，那三个模块是逐字照搬的。
plugins {
    id 'fabric-loom' version '0.12.5'
}

base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    // javac 默认报满 100 条就停。移植期一轮能报出上百条 API 差异，
    // 分批看不到全貌——把上限抬到 1000，一轮就能把同类错误一次看全。
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 官方 Mojang 映射。与上游同一套命名，源码里类名方法名一一对应。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // 引擎层。普通 JVM 依赖，同时用 include 打进 jar（jar-in-jar）：
    // 玩家只装一个文件，就同时拿到引擎。三个模块互为依赖链，
    // 三个 include 都要写，缺一个会在运行期 NoClassDefFoundError。
    implementation project(':agent')
    include project(':agent')
    include project(':ai')
    include project(':lua')

    // 寻路模块。它与上面三个不同：**它是对着 Minecraft 编译的**（要读方块、读身体），
    // 所以不能像它们那样用 include 当嵌套 jar —— 那样发出去的是一个 remapJar 产物，
    // 里面没有 fabric.mod.json，Loom 自己都会警告 "Could not find fabric.mod.json"。
    //
    // 照上游的做法（buildSrc/src/main/groovy/api-loader.gradle 的 jar 任务）**把 class 平铺进本模块的 jar**：
    // 它对着原版 Mojang 名编译，与 core 同一套命名，随后由 remapJar 连同 core 自己的类
    // 一起换成 intermediary 名。见下面 tasks.named('jar')。
    implementation project(':pathing')

    // slf4j 也要随 jar 一起发：**1.16.5 运行期没有 slf4j**（1.17+ 才随
    // log4j-slf4j-impl 引进游戏），而引擎层 ai/AiLog 与 core/NumenCore 都要用它。
    // 不这么做的话，进游戏就是 NumenCore.<clinit> 上的 NoClassDefFoundError。
    //
    // 只发 slf4j-api 还不够——没有绑定的话它会退化成 NOP logger，
    // [numen] 的日志会静默消失。log4j-slf4j-impl 把 slf4j 接到游戏自带的 log4j 上，
    // 日志于是与其它模组一样出现在 latest.log 里。
    // 版本：2.8.1 与 1.16.5 自带的 log4j 完全一致；它属于 slf4j 1.7 系绑定，
    // 所以 slf4j-api 用 1.7.36（ai/build.gradle 里也是这个版本）。
    include 'org.slf4j:slf4j-api:1.7.36'
    include 'org.apache.logging.log4j:log4j-slf4j-impl:2.8.1'

    // 单元测试(归位阶段 1 起):照上游 api/common/build.gradle 的 JUnit 5 配置。
    // MC 的类在测试里用得到(FakeWorld、注册表引导),Loom 会把 named jar 挂上测试类路径。
    // （2026-10-11 曾冤枉过这三行：丢 pathing 类的真凶是跨项目共享 remapper，见文末说明。）
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JUnit 5 平台。bisect 期间曾冤枉过它：丢 pathing 类的真凶是跨项目共享 remapper（见文末）。
//
// ⚠️ 测试运行期必须**先挂 named 的 pathing 类**（2026-10-11 归位阶段 2 实测）：
// `implementation project(':pathing')` 在 testRuntimeClasspath 上解析到的是 pathing 的
// **remapJar**（intermediary 名，如 `TerrainPolicy$Change$Place.<init>(class_2248)`），
// 而测试编译用的是 named（`<init>(net.minecraft.world.level.block.Block)`）。两套命名一混，
// 凡在测试里直接 `new` 一个**带 MC 类型描述的 pathing 类型**（如 `new Change.Place(Blocks.DIRT)`）
// 就在运行期 NoSuchMethodError——此前 core 的测试只碰 core 自己的类，没踩到。
// 把 named 的 classes 目录插到最前，让它盖过那个 remapJar（JVM 取先找到的那个）。
// 用 doFirst 而不是配置期求值：build.gradle 文末那条坑说过，配置期碰 `project(':pathing')`
// 会干扰 Loom，执行期才碰就没事。
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn ':pathing:classes'
    doFirst {
        classpath = files(project(':pathing').sourceSets.main.output) + classpath
    }
}



loom {
    // 1.16.5 的 Player.DATA_PLAYER_MODE_CUSTOMISATION 是私有的，
    // 假玩家要点亮皮肤覆盖层必须把它打开。见 numen.accesswidener。
    accessWidenerPath = file("src/main/resources/numen.accesswidener")

    mixin {
        // mixins.json 里声明的 refmap 名与 loom 默认按归档名生成的名字对不上，
        // 运行期按声明的名字读不到，这里显式对齐。上游同样处理。
        defaultRefmapName = "numen.refmap.json"
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client 1.16.5')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server 1.16.5')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// 寻路模块的类平铺进发行 jar（不是嵌套）。
//
// ⚠️ 这三条是**实测出来的**（2026-10-10 踩了六遍，别再改）：
//   1. `from` 必须是**闭包** `from({ ... })`。配置期求值的直传形式
//      （`from project(':pathing').sourceSets.main.output`）会被 Loom 自己的 jar 配置
//      **覆盖掉**——jar 里一个寻路的类都没有；而配置期把 FileCollection 打出来明明是对的。
//   2. `dependsOn` 必须是**字符串** `':pathing:classes'`（惰性）。写成
//      `tasks.named('classes')` 会在配置期解析任务对象，报 "Task not found"。
//   3. **不要**加 `evaluationDependsOn`、也不要加 `inputs.files`——配置期一碰
//      `project(':pathing')` 就会干扰 Loom，连干净构建都会坏（实测 jar 变 0 个）。
//
// ⚠️ 已知残留问题：`:core:jar` 在增量构建下可能被判 UP-TO-DATE 而跳过，
//    那时发行 jar 里**寻路的类会全部消失**（干净构建则正常，极具迷惑性）。
//    **改完 pathing 之后务必 clean 构建，并数一数 jar 里的类。**
tasks.named('jar', Jar) {
    dependsOn ':pathing:classes'
    from({ project(':pathing').sourceSets.main.output })
}

// ⚠️ remapJar 必须**独占 remapper**（loom 0.12 默认跨项目共享 TinyRemapperService）。
//
// 默认行为：core 与 pathing 的 remapJar 共用同一个 tiny-remapper 实例（服务 id 只含
// mappings+任务名，不含项目路径）。core 的发行 jar 里平铺着 pathing 的类（上面的 from），
// 而 pathing 自己的 dev jar 又作为 compileClasspath 出现——于是同一个类被两边各自读成
// **input**，tiny-remapper 按 InputTag 去重合并。一旦 pathing 侧先注册（两个 prepare 任务
// 是并发的，顺序不定），合并后的 InputTag 归属就不稳定，core 的 apply(tag) 会把 pathing
// 的类整个筛掉——发行 jar 里 pathing 一个类都不剩，而 dev jar 明明有 243 个。
// 2026-10-11 实测：`remapperIsolation = true` 后各项目独享 remapper，core 稳定输出全部类。
// 注意：这不是「要不要优化」的问题，是不加就**必然间歇性丢类**的问题。
tasks.withType(net.fabricmc.loom.task.AbstractRemapJarTask).configureEach {
    it.remapperIsolation.set(true)
}

// 「纯客户端版」（#0027）：同一份类、同一个 mod id，只是 fabric.mod.json 换成
// environment=client 的那份（core/fabric.mod.client.json）——Fabric Loader 按它过滤，
// 专用服务器上不会加载这份 jar；客户端装它就够：G 开同伴背包、B 开设置面板、
// 原版聊天直达外接 agent。服务端继续用主产物。
//
// 为什么不是两套源集：客户端要用的类（容器、协议、引擎层）与服务端交织在同一个类图里，
// 拆源集只换来"jar 小一点"，代价是两套 loom 配置与四条 include 依赖重讲一遍。
// 真要拆，等客户端侧长大到值得拆的时候再拆。
def remapClientSource = tasks.named('remapJar')
tasks.register('clientOnlyJar', Zip) {
    group = 'build'
    description = '纯客户端版：同一构建，fabric.mod.json 标 environment=client。'
    dependsOn remapClientSource
    archiveFileName = "${mod_name}-Client-fabric-${minecraft_version}-${version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ zipTree(remapClientSource.get().archiveFile) }) {
        exclude 'fabric.mod.json'
    }
    from(file('fabric.mod.client.json')) {
        rename { 'fabric.mod.json' }
    }
}
